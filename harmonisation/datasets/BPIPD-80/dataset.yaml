dataset_id: "80"
dataset_name: "ISCOLE"
status: "in_progress"

resources:
  - name: "iscole_allsubjects_data_sas"
    role: "data"
    reader: "sas"
    glob: "allsubjects_18dec2015_ver2_0.sas7bdat"
  - name: "iscole_allsubjects_data_excel"
    role: "data"
    reader: "excel"
    sheet: "_sub1"
    glob: "allsubjects_18DEC2015_Ver2_0.xlsx"
  - name: "iscole_appendix_a"
    role: "docs"
    glob: "APPENDIX A.docx"
  - name: "iscole_dta_agreement_signed"
    role: "docs"
    glob: "DTA agreement 091625 ISCOLE_ACU signed 17102025.doc"
  - name: "iscole_dta_template_agreement"
    role: "docs"
    glob: "DTAtemplateagreement 091625 ISCOLE_ACU.doc"
  - name: "iscole_data_analysis_notes"
    role: "docs"
    glob: "ISCOLE Data Analysis Notes.docx"
  - name: "iscole_formats_sas"
    role: "docs"
    glob: "Universal ISCOLE formats_allsites.sas"
  - name: "codebook_iscole_anthropometric"
    role: "codebook"
    reader: "excel"
    sheet: "Anthropometric"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_demographic"
    role: "codebook"
    reader: "excel"
    sheet: "Demographic"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_diet_and_lifestyle"
    role: "codebook"
    reader: "excel"
    sheet: "Diet & Lifestyle"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_neighborhood"
    role: "codebook"
    reader: "excel"
    sheet: "Neighborhood"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_school_audit_tool"
    role: "codebook"
    reader: "excel"
    sheet: "School Audit Tool"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_school_environment"
    role: "codebook"
    reader: "excel"
    sheet: "School Environment"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"
  - name: "codebook_iscole_accelerometry"
    role: "codebook"
    reader: "excel"
    sheet: "Accelerometry"
    glob: "ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx"

notes: |
  Main subject-level data is provided in two parallel formats: SAS (.sas7bdat) and Excel (.xlsx, sheet "_sub1").
  "Universal ISCOLE formats_allsites.sas" is a SAS syntax/format file rather than a data table, so it is included as docs.
  The two ".doc" files are data transfer agreements (signed and template) and are administrative, not analytic content --
  included as docs. "APPENDIX A.docx" and "ISCOLE Data Analysis Notes.docx" are likewise reference/administrative
  documents and included as docs.
  The codebook ("ISCOLE Data Dictionary_ALLSITES_Ver2_0.xlsx") has 7 topic sheets (Anthropometric, Demographic,
  Diet & Lifestyle, Neighborhood, School Audit Tool, School Environment, Accelerometry), each represented as a
  separate codebook resource pointing at the same file.
