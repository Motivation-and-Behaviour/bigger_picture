notes: |
  Single-wave datase. The study covers two cohorts: "Heilsuhegðun" (HH, files 01-09) and
  "Atgervi" (ATG, files 10-16), each with participant, anthropometrics, blood/fitness, questionnaire, and
  (for HH only) actigraphy tables, each xlsx file containing a single sheet named "data".
  "00_variable_dictionary.xlsx" is a shared codebook with 2 sheets, one per cohort ("Heilsuhegðun", "Atgervi").
  "17_questionnaire_codebook.xlsx" is a second codebook with 6 sheets covering the different questionnaire
  versions/ages/respondent types (HH_15_17, HH_7_9, HH_Parent, ATG_2003, ATG_2011, ATG_Parent).
  "Heilsuhegðun_Method report and codebook_Iceland_16_04_2026.docx" is included as an additional codebook
  resource.
  "cohorts.docx" and "MANIFEST.TXT" are included as docs.
