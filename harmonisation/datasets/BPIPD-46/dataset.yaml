        glob: "PCGCHILD2021_codebook.pdf"
      - name: "pcg_hh_2021"
        role: "data"
        glob: "PCGHH2021.txt"
        reader: "fwf"
        col_positions: "layouts/pcg_hh_2021.csv"
      - name: "pcg_hh_2021_codebook"
        role: "codebook"
        glob: "PCGHH2021_codebook.pdf"
      - name: "child_2021"
        role: "data"
        glob: "CHILD2021.txt"
        reader: "fwf"
        col_positions: "layouts/child_2021.csv"
      - name: "child_2021_codebook"
        role: "codebook"
        glob: "CHILD2021_codebook.pdf"
      - name: "setup_files_2021"
