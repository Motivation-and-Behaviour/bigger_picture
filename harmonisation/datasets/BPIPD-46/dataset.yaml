notes: |
  Dataset: PSID Child Development Supplement (CDS), BPIPD-46.

  Structure: one subfolder per wave (1997, 2002, 2007, 2014, 2019, 2020, 2021),
  located at the wave_dir named above (e.g. "1997/", "2002/", ...).

  Within each wave folder, data are organised as repeated groups of five files
  sharing a common basename, e.g. CHILD97.txt / .do / .sas / .sps / _codebook.pdf:
    - .txt  = raw/ASCII data file -> captured as one "data" resource
    - .do   = Stata read/setup syntax   -> captured as a "docs" resource
    - .sas  = SAS read/setup syntax     -> captured as a "docs" resource
    - .sps  = SPSS read/setup syntax    -> captured as a "docs" resource
    - _codebook.pdf = variable-level codebook -> captured as a "codebook" resource
  Each file in a group is its own resource (five resources per group total); the
  .txt data resource is listed first, immediately followed by its three read/setup
  syntax files (name suffixed "_do_syntax" / "_sas_syntax" / "_sps_syntax", also
  flagged with a "read/setup syntax" comment), then the codebook.
  The "reader" field on every .txt data resource is a PLACEHOLDER value ("ascii"),
  which is not a valid enum value per the schema - it is a marker only. Replace it
  with the confirmed real reader (most likely "stata", "sas", or "spss") once the
  intended read path for each file is decided, before using this spec with
  read_dataset_from_spec().

  Several waves (1997, 2014, 2019, 2020, 2021) also contain a "doc/" subfolder
  with wave-level reference material (user guides, questionnaires, readmes, and
  in the 1997 case, an additional set of instrument-level codebook PDFs). These
  are captured as "docs" resources with a glob path prefixed "doc/".
  Waves 2002 and 2007 had no doc/ subfolder captured in the source listing.

  Note on file reuse: the 2020 wave folder contains three file groups
  (CDSIND2019, DEMOG2019, HHROSTER2019) that carry over the 2019 file basenames
  unchanged (no new 2020 data collected for those instruments); the corresponding
  resource names are prefixed "2020_..." here to keep them distinct from the
  identically-named resources under the 2019 wave.
