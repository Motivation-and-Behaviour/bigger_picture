      - name: "documentation_2021"
        role: "docs"
        glob: "doc/*"

notes: |
  PSID Child Development Supplement (CDS), a longitudinal supplement to the US Panel Study of Income Dynamics, delivered as one folder per wave: 1997 (CDS-I), 2002 (CDS-II), 2007 (CDS-III), 2014, 2019, 2020 and 2021.
  The 2021 files are read only as donors for the 2020 carries: CDS-2021 asked only frequency screen items, so the tidier drops its rows.
  Every data file is a headerless fixed-width ASCII `.txt` file with CRLF line ends, shipped with an SPSS (`.sps`), Stata (`.do`) and SAS (`.sas`) setup file and a `<stem>_codebook.pdf` of the same stem.
  There is no `.sav`, `.dta` or other self-describing copy anywhere in the folder, so every data file is read with the `fwf` reader.
  Each layout in `layouts/` is generated from the DATA LIST block of the file's SPSS setup file by `layouts/generate_layouts.R`, which writes it only if the Stata and SAS setup files and the data file agree (positions, field count, record length, row count, CRLF); `layouts/README.md` records the checks.
  Every field of every declared file is read, and each layout carries the setup file's variable label for the tidier.
  Decimal-format fields (weights, ages in months, some scores) hold a literal decimal point in every non-blank value, so nothing is rescaled: the `decimals` layout column is provenance only.
  Data declared, 68 of the 84 distinct data files:
  - the cumulative ID map `2021/CDSIND2021` as a top-level resource (no `.wave`), which links every CDS child from 1997 to 2021 to the PSID person ID (1968 interview number and person number), the core family IDs, the PCG's IDs and per-wave file-presence flags;
  - the per-wave ID maps of 1997, 2002, 2007 and 2014 (`IDMAP*`), which give each child's CDS household interview number and household PCG indicator, the key of the PCG-household file; `CDSIND2021` lacks the PCG indicator before 2014, and 15 children in 2002 and 7 in 2007 have a PCG outside the PSID family (core ID 0), whom the core-ID link cannot reach;
  - per wave, the demographic or interview-information file, the PCG-child, PCG-household and child-interview files, the assessment file (from 2002; the 1997 assessments are in the 1997 child file), and the four time-diary files (aggregate, activity-level, media content coding, and follow-up or questionnaire);
  - the household rosters of 2014, 2019 and 2021 (one row per household member), the only source of the child's sex in the folder (no 1997-2007 file carries it);
  - the 1997 and 2002 elementary/middle-school teacher files, the 1997 preschool/day-care teacher file, and the three 1997 school and preschool time diaries (teacher-reported behaviour items and school computer use).
  2020 has no demographic or roster file of its own: its records carry 2019 IDs.
  The 2020 folder repeats `CDSIND2019`, `DEMOG2019` and `HHROSTER2019` (data, setup files and codebooks) and the two 2019 diary instruments in `doc/`, byte for byte; those copies are not declared, and the 2019 files are read once, in the 2019 wave.
  Declared as docs and not read (the `not_read_<wave>` resources, with their codebooks): the generational maps `GEN_MAP` (2002) and `GENMAP07` and the cumulative map `CDSIND2019`, superseded by `CDSIND2021`; the other-caregiver files (`OCG_*`); the 1997 fathers-outside-the-home files (`FOH_*`); the 1997 home-based care provider file and its diary; the 1997 school and preschool administrator files; and the 2020 COVID-19 household health file (`CVH2020`).
  The setup files of each wave are declared as docs (`setup_files_<wave>`), and each wave's `doc/` folder (user guides, questionnaires, instruments, readmes) as `documentation_<wave>`.
