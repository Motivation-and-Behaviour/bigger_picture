dataset_id: "820"
dataset_name: "Krahé"
status: "in_progress"

resources:
  - name: "Krahé Dataset"
    role: "data"
    glob: "Data_set_Krahé.sav"
    reader: "spss"
  - name: "Scale Handbook"
    role: "codebook"
    glob: "Scale_Handbook.docx"
  - name: "Documentation"
    role: "docs"
    glob: "{Data_description_Krahé.docx,Krahé_et al_PPMC_2012.pdf,Krahé_Möller_JOA_2011.pdf}"

notes: |
  Dataset includes primary SPSS data and supporting documents.
  'Scale_Handbook.docx' was confirmed to hold item lists, response scales and
  scale-construction keys per wave, so it is declared as 'codebook'.
  The .sav file covers T1-T3 only; the handbook documents T1-T5.
