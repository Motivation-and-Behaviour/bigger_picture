notes: >
  Young Minds Matter (BPIPD-774). 
  Root folder contains raw data in three parallel formats (SAS, SPSS, Stata) for each of three files: NAPLAN, Parent, and Youth.
  Two ".sas" syntax files (parent and youth) and one SAS format catalog (.sas7bcat) are included as docs rather than data,
  since they are not themselves readable data tables. The root PDF "Codebook" file is treated as docs since the authoritative,
  machine-readable codebooks are the structured Excel files in the CODEBOOK subfolders.
  Codebook subfolders each contain one Excel file per topic/module, with multiple sheets per file - each sheet is represented
  as a separate "codebook" resource pointing at the same glob:
    - NAPLAN codebook: 1 file, 2 sheets (NAPLAN variables, Formats).
    - Parent codebook (24 files): files 01-05 and 14-22 have 4 sheets each (Questions, Formats, Skip rules, Symbolic variables);
      files 06-13 have 5 sheets each (adds Markups); file 23 (DISC Derived Variables) and file 24 (Other Derived Variables)
      each have 2 sheets (a derived-variables sheet + Formats).
    - Youth codebook (13 files): files 01-05 and 07-12 have 4 sheets each (Questions, Formats, Skip rules, Symbolic variables);
      file 06 (MDDYouth) has 5 sheets (adds Markups); file 13 (Derived Variables Youth) has 2 sheets
      (Youth Derived Variables + Formats).
 