dataset_id: "871"
dataset_name: "Positive Body & Sex Project"
status: "in_progress"

resources:
  # --- DATA ---
  - name: "Analytical Dataset (Flat Format)"
    role: "data"
    glob: "analytical_dataset.dat"
    reader: "csv" # Delimited raw text dataset used by Mplus

  # --- CODEBOOKS, SCRIPTS & MODEL SPECIFICATIONS ---
  - name: "Mediations Model Mplus Input"
    role: "codebook"
    glob: "bopo-mediations.inp"

  - name: "Random Intercept Cross-Lagged Panel Model Mplus Input"
    role: "codebook"
    glob: "bopo-riclpm.inp"

  - name: "Longitudinal Configural Invariance Mplus Input"
    role: "codebook"
    glob: "invariance-longi-config.inp"

  - name: "Longitudinal Metric Invariance Mplus Input"
    role: "codebook"
    glob: "invariance-longi-metric.inp"

  - name: "Longitudinal Scalar Invariance Mplus Input"
    role: "codebook"
    glob: "invariance-longi-scalar.inp"

  # --- DOCUMENTATION & MODEL OUTPUTS ---
  - "name": "Mediations Analysis HTML Report"
    role: "docs"
    glob: "bopo-mediations.htm"

  - name: "Random Intercept Cross-Lagged Panel Model Mplus Output"
    role: "docs"
    glob: "bopo-riclpm.out"

  - name: "Longitudinal Configural Invariance Mplus Output"
    role: "docs"
    glob: "invariance-longi-config.out"

  - name: "Longitudinal Metric Invariance Mplus Output"
    role: "docs"
    glob: "invariance-longi-metric.out"

notes: |
  This dataset represents the Positive Body & Sex Project (BPIPD-871).
  It includes a flat data file (analytical_dataset.dat) alongside several Mplus structural 
  equation modeling (SEM) files. These files cover longitudinal measurement invariance testing 
  (configural, metric, and scalar stages), mediation models, and a Random Intercept 
  Cross-Lagged Panel Model (RI-CLPM). Model configurations (.inp) are classified as codebooks, 
  while the resulting run logs (.out, .htm) are structured as documentation.
  