notes: |
  Single-wave.
  Four SPSS data files sit in their own topic-named subfolders (Parent Diet, Parent PA, Teen Diet, Teen
  Physical Activity), each folder containing one .sav file; two further SPSS files (Parent and Teen
  Demographic) sit at the root.
  Two codebook workbooks are included, each represented as one codebook resource per sheet:
    - "FLASHE-GeoData-Codebook-revised-GeoFLASHE5.bNCI2_.xlsx": 4 sheets (GeoData, Buffer Suffixes,
      Census Variables and Formulas, Census Source Tables).
    - "FLASHE-Public-Codebook.xlsx": 5 sheets (TeenPA, TeenDiet, TeenDemo, ParentPA, ParentDemo).
  The data-user's guide and the three PUF instrument PDFs (teen demo/diet/PA) are included as docs.
