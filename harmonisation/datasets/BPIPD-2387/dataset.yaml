notes: |
  4 waves: 2001, 2005, 2007, 2009.
  Each wave has a Child and a Teen/Adolescent cohort, each with its own Stata data file(s), questionnaire PDF, and data
  dictionary PDF (treated as codebook).

  2005, 2007, and 2009 each include an additional "F"-suffixed .dta file per cohort (e.g. CHILDF.dta, TEENF.dta) -
  kept as separate role "data" resources (reader: stata) alongside the main CHILD.dta/TEEN.dta, since these appear to
  be supplementary data tables (e.g. imputation/replicate-weight flags) rather than documentation.
