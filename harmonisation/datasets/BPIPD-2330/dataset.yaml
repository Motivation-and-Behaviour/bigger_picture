notes: |
  Lui et al. (2021), Infant Behavior and Development 65, 101649 (OSF https://osf.io/w8gs4/): a cross-sectional analysis of the first (10-month) lab visit of an Oxford BabyLab study, one row per infant.
  The only data file is the SPSS .sav (163 rows, 39 columns, unique Random_ID); no other format of the data is supplied.
  Per the data note, the 9 infants whose parents declined data sharing (Data_Sharing = 2) keep only their Random_ID; all other columns are empty for them.
  The data note PDF, the Touchscreen Use Questionnaire (SM1, an embedded image) and the TUQ descriptive tables (SM2, n = 150 before the 9 withdrawals) are declared as codebooks.
  The other supplementary files (item-level TUQ analysis, ECITT coding protocol, the ECITT trial-level Excel template with one placeholder participant, and the analysis tables SM7 to SM9) are declared as docs; SM5 is a blank template, not participant data.
  Not declared: SM6_Assumption_and_Distribution_Checks .docx (distribution plots and assumption tests only, nothing for the project).
