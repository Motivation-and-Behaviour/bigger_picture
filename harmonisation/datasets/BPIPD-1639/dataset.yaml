dataset_id: "1639"
dataset_name: "Prevention of Overweight in Infancy (POI) study"
status: "harmonised"

resources:
  - name: "demographics"
    role: "data"
    glob: "Demographics.xls"
    sheet: "Data"
    reader: "excel"
  - name: "questionnaire"
    role: "data"
    glob: "Questionnaire5FINAL.xlsx"
    sheet: "Data"
    reader: "excel"
  - name: "self_control"
    role: "data"
    glob: "Selfcontrol5years.xlsx"
    sheet: "Data"
    reader: "excel"

notes: |
  Longitudinal, but the 3.5-year wave has no usable screen-time measure; treated as cross-sectional at age 5.
  Many additional variables, especially parenting, remain unharmonised.
  Scaled scores used where possible (e.g. NEPSY).
