dataset_id: "666"
dataset_name: "Mallawaarachchi"
status: "in_progress"
resources:
  - name: "Quantitative Metadata"
    role: "docs"
    glob: "Data/Metadata/quant_meta_07Oct22.xls"
  - name: "Final Tables and Figures"
    role: "docs"
    glob: "Tables and figures/{Quant_Tables v1.docx,Suppl material_08Nov22.docx}"
waves:
  - wave: "data_cleaning"
    label: "data_cleaning"
    wave_dir: "."
    resources:
      - name: "Master Baseline Data"
        role: "data"
        glob: "Data/1. Data cleaning and recoding/MASTER_BL_dataset_thesis SM.csv"
        reader: "csv"
      - name: "Cleaning Documentation"
        role: "docs"
        glob: "Data/1. Data cleaning and recoding/{1. General variable recoding.Rmd,1. General-variable-recoding.docx}"
  - wave: "descriptives"
    label: "descriptives"
    wave_dir: "."
    resources:
      - name: "Working Baseline Data"
        role: "data"
        glob: "Data/2. Total sample descriptives/BL_workingcopy.csv"
        reader: "csv"
      - name: "Descriptives Documentation"
        role: "docs"
        glob: "Data/2. Total sample descriptives/{2. Total sample descriptives.Rmd,2. Total-sample-descriptives.docx}"
  - wave: "preschooler_corr"
    label: "preschooler_corr"
    wave_dir: "."
    resources:
      - name: "Preschooler/Toddler Baseline Data"
        role: "data"
        glob: "Data/3. Toddler or preschooler correlations/{data_bl_P.csv,data_bl_T.csv}"
        reader: "csv"
      - name: "Correlation Documentation"
        role: "docs"
        glob: "Data/3. Toddler or preschooler correlations/{3. Preschooler recoding and corr.Rmd,3. Preschooler-recoding and corr.docx,3. Toddler recoding and corr.Rmd}"
  - wave: "regressions"
    label: "regressions"
    wave_dir: "."
    resources:
      - name: "Regression Analysis Data"
        role: "data"
        glob: "Data/4. Toddler or preschooler regressions/{BL_P_reg.csv,BL_T_all.csv}"
        reader: "csv"
      - name: "Regression Documentation"
        role: "docs"
        glob: "Data/4. Toddler or preschooler regressions/{4. Preschoolers_reg_NEW.docx,4. Preschoolers_reg_NEW.Rmd,4. toddler_reg_NEW.docx,4. toddler_reg_NEW.Rmd}"
  - wave: "longitudinal"
    label: "longitudinal"
    wave_dir: "."
    resources:
      - name: "Longitudinal Dataset"
        role: "data"
        glob: "Data/Longitudinal analyses/{data_longit_cleaned_v2.csv,data_longit_P_v4.csv,data_longit_recoded_v3.csv,data_longit_T_v4.csv,Data_Longit2022.csv,data_longitudinal_v1.csv,Longit_P_analyses_v5.csv,Longit_p_reg_log.csv,Longit_T_analyses_v5.csv,Longit_t_reg_log.csv}"
        reader: "csv"
      - name: "Longitudinal Scripts/Docs"
        role: "docs"
        glob: "Data/Longitudinal analyses/{Longit_preschoolers_analyses 08Nov22.Rmd,Longit_toddlers_analyses 08Nov22.Rmd,Preschooler_longit_reg 17Aug22.Rmd,R script_data merging_BL&F 12Aug22.R,Rscript_cleaning _longit12Aug22.R,Rscript_descriptives 12Aug22.R,Rscript_preschooler_longit corr_09Nov22.R,Rscript_preschoolerrecoding_15Aug22.R,Rscript_toddlerlongit corr_09Nov22.R,Rscript_toddlerrecoding_12Aug22.R,Rscript_variablerecoding_12Aug22.R,Toddler_longit_reg 17Aug22.Rmd}"
      - name: "Additional Analyses Data"
        role: "data"
        glob: "Data/Additional analyses/{Longit_P_analyses_v5.csv,Longit_T_analyses_v5.csv}"
        reader: "csv"
      - name: "Additional Analyses Scripts"
        role: "docs"
        glob: "Data/Additional analyses/{Rscript_longit_preschoolerssuppl_15May23.R,Rscript_longit_toddlersuppl_12May23.R}"
notes: |
  Dataset is organized by analytical stage under a top-level "Data" folder, plus a separate top-level "Tables and figures" folder for final outputs.
  Data files are CSV (reader: csv), one resource per stage: baseline cleaning, descriptives, preschooler/toddler correlations, preschooler/toddler regressions, and longitudinal analyses. The longitudinal stage has two source folders - "Longitudinal analyses" (primary/final data, scripts, and Rmd documentation) and "Additional analyses" (supplementary preschooler/toddler CSVs and supplementary R scripts, dated May 2023).
  Documentation is a mix of R Markdown (.Rmd), Word (.docx), and R scripts (.R), matched one-to-one with each data resource's analytical stage.
  Two dataset-wide resources sit outside the wave structure: a quantitative metadata spreadsheet (Data/Metadata) and final tables/figures Word documents (Tables and figures, top-level folder, sibling to Data).
  Note: Longit_P_analyses_v5.csv and Longit_T_analyses_v5.csv exist under both "Longitudinal analyses" and "Additional analyses" with identical filenames - both locations are included as separate resources since it is unclear whether these are duplicates or distinct versions.
