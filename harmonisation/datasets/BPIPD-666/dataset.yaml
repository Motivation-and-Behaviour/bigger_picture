notes: |
  Dataset is organized by analytical stage under a top-level "Data" folder, plus a separate top-level "Tables and figures" folder for final outputs.
  Data files are CSV (reader: csv), one resource per file, per stage: baseline cleaning, descriptives, preschooler/toddler correlations, 
  preschooler/toddler regressions, and longitudinal analyses. The longitudinal stage has two source folders - "Longitudinal analyses" 
  (primary/final data, scripts, and Rmd documentation) and "Additional analyses" (supplementary preschooler/toddler CSVs and supplementary 
  R scripts, dated May 2023).
  Documentation is a mix of R Markdown (.Rmd), Word (.docx), and R scripts (.R), one resource per file, matched to each data resource's analytical stage.
  Two dataset-wide resources sit outside the wave structure: a quantitative metadata spreadsheet (Data/Metadata) and final tables/figures Word documents 
  (Tables and figures, top-level folder, sibling to Data).
  Note: Longit_P_analyses_v5.csv and Longit_T_analyses_v5.csv exist under both "Longitudinal analyses" and "Additional analyses" with identical filenames - 
  both locations are included as separate resources since it is unclear whether these are duplicates or distinct versions.
