dataset_id: "788"
dataset_name: "KiGGS"
status: "in_progress"

waves:
  - wave: "2"
    label: "KiGGS Wave 2"
    wave_dir: "."
    resources:
      - name: "Main Dataset (Stata Format)"
        role: "data"
        glob: "KiGGS2.dta"
        reader: "stata"
      - name: "Main Dataset (SPSS Format)"
        role: "data"
        glob: "KiGGS2.sav"
        reader: "spss"
      - name: "Dataset Info (QSDB Sheet)"
        role: "codebook"
        glob: "Dokumentation/KiGGS2_DatenInfo.xlsx"
      - name: "Dataset Info Generated Variables"
        role: "codebook"
        glob: "Dokumentation/KiGGS2_Dateninfo_generierte_Variablen.xlsx"
      - name: "Variable Overview"
        role: "codebook"
        glob: "Dokumentation/KiGGS2_Variablenuebersicht.xlsx"
      - name: "Laboratory Parameters"
        role: "codebook"
        glob: "Dokumentation/Laborparameter_KiGGS2.xlsx"
      - name: "Laboratory Parameters - Reference Ranges"
        role: "codebook"
        glob: "Dokumentation/Laborparameter_KiGGS2.xlsx"
      - name: "Analysis Complex Survey Plan Files"
        role: "codebook"
        glob:
          [
            "wQS.csaplan",
            "wQSFB.csaplan",
            "wQSlab.csaplan",
            "wQSpop.csaplan",
            "wQSUS.csaplan",
            "wQSUSpop.csaplan",
          ]
      - name: "Documentation"
        role: "docs"
        glob:
          - "Liesmich_KiGGS2.txt"
          - "Dokumentation/*.pdf"

notes: |
  KiGGS Wave 2 includes data for children and adolescents. 
  The dataset includes primary health data in multiple formats (Stata, SAS, SPSS). Includes
  documentation - laboratory parameter comparisons and variable dictionaries. Questionnaires are categorized by target 
  group: "E" for Parents (Eltern) and "PB" for Participants/Adolescents (Probanden). 
  Also includes survey plan files (.csaplan) for statistical weighting and analysis.
  The configuration uses root-level referencing to capture files located both in the 
  root directory and within the 'Dokumentation' subdirectory.
