notes: |
  TEPS (Transition from Education to Employment Panel Survey) is organised into 
  four wave directories (2001, 2003, 2005, and 2007). Questionnaire PDFs are 
  treated as codebooks because they document survey instruments and variable 
  content. TEPS-EnglishOverview PDFs and User Guide documents are treated as 
  documentation resources. Many datasets are distributed in multiple equivalent 
  formats (.dat, .sas, .sav, and .dta). To avoid duplication while retaining 
  full access to the data content, only the Stata (.dta) versions are included 
  in this specification. Where large groups of teacher datasets follow a 
  consistent naming convention within a single folder, wildcard globs are 
  used to capture all available Stata files.
