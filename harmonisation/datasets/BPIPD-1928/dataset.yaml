notes: |
  PeNSE (Pesquisa Nacional de Saude do Escolar - National School Health Survey) has 6 waves: 2009, 2012, 2015 
  (two independent samples), 2019, and 2024.
  Where a wave provides the same data in multiple formats (.txt/.csv/.sas7bdat alongside .xlsx), 
  the .xlsx version was treated as the canonical "data" resource (reader: excel, with the sheet supplied), 
  since that is the format sheet names were confirmed for. The other-format duplicates are included as "docs" 
  resources.
  Codebook/dictionary files that contain more than one relevant sheet (e.g. 2012, 2015 samples, 2019) 
  have been split into one codebook resource per sheet.
  Two files needed a judgment call because they don't fit cleanly as "docs" despite being syntax rather than survey data:
    - 2009 "SAS_2009.xls" (SAS input/read specification) - classified as role "codebook" (reader: excel, sheet: "SAS") 
      since it structurally describes how to read the raw data, similar to a data dictionary.
    - Plain .sas syntax files elsewhere (2012 "Input SAS" folder) had no sheet specified and were left as role "docs" with no reader.
  Two folder/file names contain corrupted characters that were confirmed by copying directly from the file explorer: 
  "Documentaç╞o" and "DROGAS IL╓CITAS.doc". These are almost certainly "Documentação" and "DROGAS ILÍCITAS.doc" 
  (Portuguese for "Documentation" and "Illicit Drugs") with mangled accented characters - this typically happens 
  when a zip/archive containing accented filenames is extracted using the wrong codepage, permanently baking incorrect 
  box-drawing characters into the filename. The glob values above use the literal corrupted characters as confirmed, 
  since that is what must match on disk. If the files are ever renamed/re-extracted with correct encoding, these globs 
  will need to be updated to match.
  Note: the dataset is named "Brazilian National Health Survey", though the underlying files are all prefixed "PeNSE", 
  which specifically refers to the National **School** Health Survey (student-focused), distinct from the general 
  Brazilian National Health Survey (PNS). Flagging in case the dataset_name should instead reference PeNSE/School Health Survey.
