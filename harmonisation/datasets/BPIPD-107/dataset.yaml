notes: |
  IMPORTANT: no primary survey microdata file (.sav/.dta/.csv of actual PISA student/school responses) was
  identified. Every file here is a Stata do-file, SPSS syntax file,
  Stata ado-macro, PowerShell script, markdown readme, or a job-list/reference file - i.e. this appears to be
  the public REPLICATION CODE repository for PISA 2022, not the raw dataset itself. All resources are
  therefore role "docs".
  