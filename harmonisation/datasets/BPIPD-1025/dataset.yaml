notes: |
  9 UKDA study folders, one per sweep/data release, each used as a wave (wave id = UKDA study number):
    3535 - age 16 / sweep 5 (1986) main sweep data + JIIG-CAL occupational interests
    3723 - age 10 / sweep 3 (1980)
    3833 - age 26 / sweep 6 (1996)
    5585 - age 34 / sweep 7 (2004), incl. child/parent follow-up and self-completion questionnaires
    6095 - age 16 supplementary - arithmetic test dataset
    7473 - age 42 / sweep 8 (2012) follow-up, incl. a variable lookup table
    8288 - age 16 supplementary - reading and matrices tests
    8949 - age 16 supplementary - leisure and television diaries
    9347 - age 51 / sweep 11 (2021), incl. COVID-related modules and a variable lookup table

  Each wave follows the same UKDA folder layout: mrdoc/pdf/ (documentation), mrdoc/excel/ (variable lookup table
  where present), and spss/spss28/ (data, role data, reader spss).

  Variable lookup tables:
    - 7473 (age 42/2012): exists in both PDF and Excel form. The PDF is used
      as the codebook resource; the Excel version is kept as docs instead. 
    - 9347 (age 51/2021): only an Excel version of the codebook exists.

  Administrative files are read in as docs resources for every wave:
    - {study}_file_information.rtf - UKDA study-level file manifest/cover sheet.
    - UKDA_Study_{study}_Information.htm - UKDA's study information page (nested under mrdoc/pdf/UKDA/).
    - ukda_data_dictionaries.zip - a zipped archive of data dictionaries (no reader exists for .zip in the
      schema, so this is docs-only and its contents are not unpacked/read individually).
    - read{study}.htm - the top-level "read me" HTML file for the study folder.

  Each resource name is prefixed with its wave/study number (bcs{study}_...) to keep names globally unique per the schema.
