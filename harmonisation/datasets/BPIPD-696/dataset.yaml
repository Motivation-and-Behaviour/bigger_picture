dataset_id: "696"
dataset_name: "Kaur"
status: "in_progress"

waves:
  - wave: "Baseline"
    label: "Baseline"
    wave_dir: "."
    resources:
      - name: "data-baseline-control"
        role: "data"
        glob: "Clean.Baseline .xlsx"
        sheet: "Control arm"
        reader: "excel"
      - name: "data-baseline-intervention"
        role: "data"
        glob: "Clean.Baseline .xlsx"
        sheet: "Intervention arm"
        reader: "excel"
  - wave: "Midline"
    label: "Midline"
    wave_dir: "."
    resources:
      - name: "data-midline-control"
        role: "data"
        glob: "Midline.xlsx"
        sheet: "Control arm"
        reader: "excel"
      - name: "data-midline-intervention"
        role: "data"
        glob: "Midline.xlsx"
        sheet: "Intervention arm"
        reader: "excel"
  - wave: "Endline"
    label: "Endline"
    wave_dir: "."
    resources:
      - name: "data-endline-control"
        role: "data"
        glob: "Endline clean.xlsx"
        sheet: "Control arm"
        reader: "excel"
      - name: "data-endline-intervention"
        role: "data"
        glob: "Endline clean.xlsx"
        sheet: "Intervention arm"
        reader: "excel"

notes: |
  3 waves: Baseline, midline, endline.
  Each have dataset only (.xlsx)
  Each wave has control arm and intervention arm sheets.
  Baseline has an additional sheet called "Baseline" that is not declared:
  it has no header row, so readxl takes its first record as the column names,
  and it is not the two baseline arm sheets stacked. The arm sheets carry the
  usable baseline data.
  File also contains an ANOVA.sav (not read in)
  and a blank "evaluation PLUMS.xlsx" process-evaluation form (not read in).
