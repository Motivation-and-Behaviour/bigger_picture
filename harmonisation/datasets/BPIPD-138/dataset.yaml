notes: |
  Dataset: Healthy Steps for Young Children, BPIPD-138 (ICPSR study 04049).

  Structure: single root folder "ICPSR_04049" containing ten DS000X subfolders
  (DS0001-DS0010), each holding exactly one SPSS Portable (.por) data file, plus a
  set of top-level reference files (description/citation, manifest, related
  literature, two user guide volumes, and a terms-of-use page).

  No dataset-specific codebook file was present in this listing - the two user
  guide PDFs ("04049-User_guide-volume_1.pdf" / "volume_2.pdf") appear to be the
  closest equivalent (ICPSR user guides typically bundle codebook-style variable
  documentation alongside methodology), but they've been captured as "docs"
  resources rather than "codebook" since it isn't confirmed they are laid out as
  a per-variable codebook. Reclassify to role "codebook" if, on inspection, either
  volume is in fact a variable-level codebook.
