notes: |
  Dataset: Healthy Steps for Young Children, BPIPD-138 (ICPSR study 04049).

  Structure: single root folder "ICPSR_04049" containing ten DS000X subfolders
  (DS0001-DS0010), each holding exactly one SPSS Portable (.por) data file, plus a
  set of top-level reference files (description/citation, manifest, related
  literature, two user guide volumes, and a terms-of-use page).

  The two user guide PDFs ("04049-User_guide-volume_1.pdf" / "volume_2.pdf") are
  the codebook: each carries a copy of the instrument followed by a per-variable
  frequency table with value labels, and the guide itself states "The frequencies
  serve as the 'codebook' for this data set" (volume 2, under each interview).
  They are declared with role "codebook" for that reason.

  The .por data files carry variable labels but no value labels, so these two
  PDFs are the only source of value-label meanings for the whole release.
