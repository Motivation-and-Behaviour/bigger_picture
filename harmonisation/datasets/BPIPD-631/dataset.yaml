dataset_id: "631"
dataset_name: "UK Understanding Society"
status: "in_progress"

resources:
  # Youth self-completion questionnaires, read whole: the child's own report,
  # incl. screen-use items. BHPS waves 4-18 (ages 11-15), UKHLS waves 1-15
  # (ages 10-15).
  - name: "bhps_youth"
    role: "data"
    glob: "stata/stata14_se/bhps/b?_youth.dta"
    reader: "stata"
  - name: "ukhls_youth"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_youth.dta"
    reader: "stata"

  # Context files, joined to the youth files in the tidier. Very wide (up to
  # ~3,100 columns), so only join keys and context items are read; the data
  # dictionaries below list the rest.
  #
  # BHPS youth files carry no age or sample origin; `age` here is age at
  # interview and `memorig` the individual sample origin, joined on pidp.
  - name: "bhps_indall"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_indall.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "b[d-r]_hidp"
      - "b[d-r]_pno"
      - "b[d-r]_age"
      - "b[d-r]_memorig"
  # Household relationship files, one row per ordered pair of household
  # members: BHPS youths' resident siblings are counted from them in the
  # tidier (UKHLS youth files carry the study's count, nnssib_dv).
  - name: "bhps_egoalt"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_egoalt.dta"
    reader: "stata"
    columns:
      - "b[d-r]_hidp"
      - "b[d-r]_pno"
      - "b[d-r]_rel"
  # Adult interviews: parents' education and occupation, and their own GHQ-12
  # Likert score (scghq1_dv, adult self-completion), joined on hidp + the
  # youth's mnspno/fnspno.
  - name: "bhps_indresp"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_indresp.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "b[d-r]_hidp"
      - "b[d-r]_pno"
      - "b[d-r]_sex"
      - "b[d-r]_age"
      - "b[d-r]_hiqual_dv"
      - "b[d-r]_jbstat"
      - "b[d-r]_jbnssec8_dv"
      - "b[d-r]_scghq1_dv"
  - name: "ukhls_indresp"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_indresp.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "[a-o]_hidp"
      - "[a-o]_pno"
      - "[a-o]_sex"
      - "[a-o]_age_dv"
      - "[a-o]_hiqual_dv"
      - "[a-o]_jbstat"
      - "[a-o]_jbnssec8_dv"
      - "[a-o]_scghq1_dv"
  # Child files: whether the child attends a state or private school
  # (schsta), reported by a parent in the adult interview; only the waves
  # that ask it. BHPS files hold one row per responding parent and child (pno
  # is the parent's, scpno the child's); UKHLS ones one row per child, with
  # the parent who answered the school questions in rapno2. From UKHLS wave
  # 3, schsta is asked only of children not still at the school recorded
  # last time; stillstate/stillpriv record that they are.
  - name: "bhps_child"
    role: "data"
    glob: "stata/stata14_se/bhps/b{l,m,q}_child.dta"
    reader: "stata"
    columns:
      - "b[lmq]_hidp"
      - "b[lmq]_pno"
      - "b[lmq]_scpno"
      - "b[lmq]_schsta"
  - name: "ukhls_child"
    role: "data"
    glob: "stata/stata14_se/ukhls/{a,c,e,g,h,i,k,m,o}_child.dta"
    reader: "stata"
    columns:
      - "[a-o]_hidp"
      - "[a-o]_pno"
      - "[a-o]_(schsta|stillstate|stillpriv)"
      - "[a-o]_rapno2"
  # Parenting-style files (UKHLS waves 3-15): the 32-item Parenting Styles
  # and Dimensions Questionnaire (ps1-ps32) and the study's authoritative,
  # authoritarian and permissive scores, self-completed by each responsible
  # parent about any child aged 10; one row per parent and child (pno is the
  # parent's, childpno the child's).
  - name: "ukhls_parstyle"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_parstyle.dta"
    reader: "stata"
    columns:
      - "[c-o]_hidp"
      - "[c-o]_pno"
      - "[c-o]_childpno"
      - "[c-o]_ps[0-9]+"
      - "[c-o]_psdq[abc]_dv"
  # Household questionnaires: income and composition, joined on hidp.
  # fihhmngrs_dv is the income measure both surveys share. BHPS youth files
  # carry no interview date or region; those come from here instead
  # (intdatey/intdatem, gor_dv).
  - name: "bhps_hhresp"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_hhresp.dta"
    reader: "stata"
    columns:
      - "b[d-r]_hidp"
      - "b[d-r]_fihhmngrs_dv"
      - "b[d-r]_tenure_dv"
      - "b[d-r]_hhsize"
      - "b[d-r]_nkids_dv"
      - "b[d-r]_intdatey"
      - "b[d-r]_intdatem"
      - "b[d-r]_gor_dv"
  # Sample-design file: PSU and strata, already coded on the pooled UKHLS
  # numbering scheme (`bd_psu` etc. are labelled "UKHLS Primary Sampling
  # Unit", distinct from the BHPS-only `_bh` variables). Fills the gaps in
  # the `psu`/`strata` columns the UKHLS youth files carry directly.
  - name: "bhps_hhsamp"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_hhsamp.dta"
    reader: "stata"
    columns:
      - "b[d-r]_hidp"
      - "b[d-r]_psu"
      - "b[d-r]_strata"
  - name: "ukhls_hhresp"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_hhresp.dta"
    reader: "stata"
    columns:
      - "[a-o]_hidp"
      - "[a-o]_fihhmngrs_dv"
      - "[a-o]_fihhmnnet1_dv"
      - "[a-o]_ieqmoecd_dv"
      - "[a-o]_tenure_dv"
      - "[a-o]_hhsize"
      - "[a-o]_nkids_dv"
  # Cross-wave person file, one row per person: ethnic group (BHPS youth
  # files lack it) and UK birthplace, joined on pidp to each youth and
  # resident parent; the youth's birth weight and timing, as the mother
  # reported them (UKHLS `bw*`, BHPS `bw*_bh`), joined to the youth only.
  - name: "xwavedat"
    role: "data"
    glob: "stata/stata14_se/ukhls/xwavedat.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "ethn_dv"
      - "bornuk_dv"
      - "bwt"
      - "bwtlb"
      - "bwtoz"
      - "bwtk"
      - "bwtxp"
      - "bwtel"
      - "bwtwk"
      - "bwtkn_bh"
      - "bwtlb_bh"
      - "bwtoz_bh"
      - "bwtgm_bh"
      - "bwtxp_bh"
      - "bwtel_bh"
      - "bwtwk_bh"

  - name: "Technical and Survey Documentation"
    role: "docs"
    glob: ["mrdoc/pdf/*.pdf", "mrdoc/UKDA/UKDA_Study_6614_Information.htm", "mrdoc/read6614.htm", "mrdoc/6614_file_information.rtf"]
  # One data dictionary per data file in the release, including
  # columns/files not read above.
  - name: "Data Dictionaries"
    role: "codebook"
    glob: "mrdoc/ukda_data_dictionaries/{bhps,ukhls}/*.rtf"

notes: |
  Understanding Society (UKHLS), including historical BHPS data. Stata (.dta) files by wave and respondent type.
  Only the youth self-completion files are read whole; individual, household, enumeration and cross-wave person files are read for join keys and context only (see `columns`).
  Full release described by the per-file data dictionaries in mrdoc/ukda_data_dictionaries/.
  BPIPD-631 - UK Understanding Society
