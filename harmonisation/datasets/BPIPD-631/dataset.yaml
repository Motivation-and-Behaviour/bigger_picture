dataset_id: "631"
dataset_name: "UK Understanding Society"
status: "in_progress"

resources:
  # Youth self-completion questionnaires, read whole: the child's own report,
  # including the screen-use items. BHPS waves 4-18 (ages 11-15) and UKHLS
  # waves 1-15 (ages 10-15).
  - name: "bhps_youth"
    role: "data"
    glob: "stata/stata14_se/bhps/b?_youth.dta"
    reader: "stata"
  - name: "ukhls_youth"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_youth.dta"
    reader: "stata"

  # Context files, joined to the youth files in the tidier. These are very
  # wide (up to ~3,100 columns), so only join keys and context items are read;
  # the data dictionaries below list everything else they hold.
  #
  # BHPS youth files carry no age; `age` here is the youth's age at interview,
  # joined on pidp.
  - name: "bhps_indall"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_indall.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "b[d-r]_hidp"
      - "b[d-r]_pno"
      - "b[d-r]_age"
  # Adult interviews: parents' education and occupation, joined on
  # hidp + the youth's mnspno/fnspno.
  - name: "bhps_indresp"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_indresp.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "b[d-r]_hidp"
      - "b[d-r]_pno"
      - "b[d-r]_sex"
      - "b[d-r]_age"
      - "b[d-r]_hiqual_dv"
      - "b[d-r]_jbstat"
      - "b[d-r]_jbnssec8_dv"
  - name: "ukhls_indresp"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_indresp.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "[a-o]_hidp"
      - "[a-o]_pno"
      - "[a-o]_sex"
      - "[a-o]_age_dv"
      - "[a-o]_hiqual_dv"
      - "[a-o]_jbstat"
      - "[a-o]_jbnssec8_dv"
  # Household questionnaires: household income and composition, joined on hidp.
  # fihhmngrs_dv (gross monthly household income) is the income measure both
  # surveys share. BHPS youth files carry no interview date or region, so the
  # BHPS household's interview year and month (intdatey/intdatem) and
  # Government Office Region (gor_dv) come from here.
  - name: "bhps_hhresp"
    role: "data"
    glob: "stata/stata14_se/bhps/b{d,e,f,g,h,i,j,k,l,m,n,o,p,q,r}_hhresp.dta"
    reader: "stata"
    columns:
      - "b[d-r]_hidp"
      - "b[d-r]_fihhmngrs_dv"
      - "b[d-r]_tenure_dv"
      - "b[d-r]_hhsize"
      - "b[d-r]_nkids_dv"
      - "b[d-r]_intdatey"
      - "b[d-r]_intdatem"
      - "b[d-r]_gor_dv"
  - name: "ukhls_hhresp"
    role: "data"
    glob: "stata/stata14_se/ukhls/?_hhresp.dta"
    reader: "stata"
    columns:
      - "[a-o]_hidp"
      - "[a-o]_fihhmngrs_dv"
      - "[a-o]_fihhmnnet1_dv"
      - "[a-o]_ieqmoecd_dv"
      - "[a-o]_tenure_dv"
      - "[a-o]_hhsize"
      - "[a-o]_nkids_dv"
  # Cross-wave person file, one row per person in either survey: ethnic group
  # (which the BHPS youth files lack) and whether born in the UK, joined on
  # pidp to each youth and to each resident parent.
  - name: "xwavedat"
    role: "data"
    glob: "stata/stata14_se/ukhls/xwavedat.dta"
    reader: "stata"
    columns:
      - "pidp"
      - "ethn_dv"
      - "bornuk_dv"

  - name: "Technical and Survey Documentation"
    role: "docs"
    glob: ["mrdoc/pdf/*.pdf", "mrdoc/UKDA/UKDA_Study_6614_Information.htm", "mrdoc/read6614.htm", "mrdoc/6614_file_information.rtf"]
  # One data dictionary per data file, for every file in the release, including
  # the columns and files not read above.
  - name: "Data Dictionaries"
    role: "codebook"
    glob: "mrdoc/ukda_data_dictionaries/{bhps,ukhls}/*.rtf"

notes: |
  Understanding Society (UKHLS) study, including historical BHPS data.
  The dataset comprises longitudinal survey data in Stata format (.dta)
  categorized by wave and respondent type. Extensive documentation is
  included, featuring technical reports, questionnaires, and fieldwork
  materials provided in PDF, RTF, and HTM formats.
  Only the youth self-completion files are read whole; the individual,
  household, enumeration and cross-wave person files are read for join keys
  and context variables only (see `columns`). The full release is described
  by the per-file data dictionaries in mrdoc/ukda_data_dictionaries/.
  BPIPD-631 - UK Understanding Society
