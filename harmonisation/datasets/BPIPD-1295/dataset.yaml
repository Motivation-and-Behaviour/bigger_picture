notes: |
  Multiple ICPSR study folders (ICPSR_07896, ICPSR_08297, ICPSR_08443, and ICPSR_08896).
  
  Four primary ICPSR directory packages containing numerous data subsets (DS0001 through DS0038) 
  corresponding to different survey waves, cohorts (sophomores and seniors), school-level surveys, 
  and student/parent/teacher components.
  
  Data files are provided in flat ASCII data text files (.txt, .dat) - assigned with an ASCII reader placeholder 
  paired with SPSS setup syntax files (.sps) or record layouts, PDF and text-based codebooks, multi-file codebooks, 
  and modern SPSS binary data files (.sav) for specific study parts.
  