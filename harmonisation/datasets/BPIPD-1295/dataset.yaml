notes: |
  High School and Beyond (HS&B), the NCES longitudinal survey of US high-school sophomores and seniors first surveyed in spring 1980, delivered as four ICPSR collections: 07896 (base year 1980), 08297 (first follow-up 1982), 08443 (second follow-up 1984) and 08896 (third follow-up release, which repeats the base-year to 1984 data for the follow-up subsamples and adds 1986).
  The 1980 and 1982 files are headerless fixed-width ASCII files, one line per case, read with the `fwf` reader; their layouts in `layouts/` are generated from the study's own SPSS setup files by `layouts/generate_layouts.R`, and `layouts/README.md` records the rules, the checks and the decimal findings.
  The reader does not apply implied decimals: each layout's `rescale_decimals` column gives the power of ten the tidier must divide a field by (blank where the file already holds the value on its scale, including every field of the twins file, which stores decimal fields rounded to whole numbers).
  Declared as data: the 1980 student file (all 30,030 sophomores and 28,240 seniors), the 1980 language file (students with non-English language background), the two 1980 teacher-comment files (several teachers per student), the 1980 twins and siblings file (family ID `FAMID`), the 1982 sophomore and senior follow-up files (each repeating its cohort's base-year items), the 1982 local labour-market indicators and the 1982 school file (one row per school, linked to students by the first four characters of the student ID), and the two 08896 `.sav` files for the 1984 (and 1986) waves.
  The base-year `CASEID` and the follow-up `ID` are the same key: all 27,118 base-year participants in the 1982 sophomore file and all 11,500 in the 1982 senior file match a base-year `CASEID`, and their base-year sex, TV, age, race and height items agree on every matched record.
  The 1984 wave is read from the 08896 `.sav` files rather than the 08443 ASCII files: they hold the same 14,825 sophomores and 11,995 seniors, carry all 665 sophomore and 680 senior 1984 questionnaire items, value labels, decimals already applied, birth-date composites and panel weights, and are the later release; the 08443 student files are declared as docs, and their few extra composites (`SES`, `TEST`, `HSGPA`, transcript credit totals) are listed in `BPIPD-1295_notes.md` in case a mapping needs them.
  The 08896 senior file covers the same 11,995 seniors as the 1982 senior file and repeats nearly all of its items, so the tidier takes each senior wave from one of them only; the 1982 sophomore file is the only source for the 1982 wave of the 14,912 sophomores outside the 1984 subsample.
  Not read, and declared as docs with the reason: the 1980 school file (a subset of the 1982 school file, identical on every shared field), the 1980 parent and friends files (no setup file in the folder), the card-image user manual, SAS documentation and CSSC course-code lists, the hierarchical high-school transcript and course-offering files (two record types per file), the 1984 Administrator and Teacher Survey (several 80-column cards per case), and the postsecondary transcript files of 08443 and 08896, which describe students after high school; setup syntax and record layouts are docs, codebooks are codebook.
  The manifests also list SAS control cards (all four collections) and Stata, TSV, R and fixed-width versions of the 08896 parts that are not in the folder.
