notes: |
  Contains 6 sweeps, starting from sweep 2 and ending in sweep 7.
  SPSS (.sav) files are categorized into Child, Parent, and Family modules. Codebooks are excel data dictionaries. Documentation includes technical reports and user 
  guides required for cross-sweep analysis. Administrative files (.rtf, .htm, .zip) are excluded to maintain repository focus.
  