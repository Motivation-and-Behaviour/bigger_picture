notes: |
  Contains 6 sweeps (sweep_2 through sweep_7), covering ages 3, 5, 7, 11, 14, and 17.
  Data files are SPSS .sav files, one resource per sweep, covering Child (cm_*), Parent/Proxy-partner, Family, Household grid (hhgrid), and (from sweep 6) Time-Use-Diary and accelerometer modules. Sweep 6 also includes four national Index of Multiple Deprivation (IMD) files.
  Codebook is a single longitudinal Excel data dictionary (mcs_longitudinal_data_dictionary_2021-02-03.xlsx, sheet "Survey_Collection_DataDict") shared across all sweeps.
  Documentation is PDF, one resource per sweep, and includes technical reports, user guides, questionnaires (parent/CAWI/self-completion/teacher), showcards, and coding/editing booklets. Sweeps 2-4 also include an Excel wave-correspondence file (mcs_1-4_new-long_old-wide_correspondence) mapping old/new variable naming across sweeps 1-4.
  Folder structure per sweep: {sweep folder}/spss/spss28/*.sav (data), {sweep folder}/mrdoc/excel/*.xlsx (codebook + correspondence file), {sweep folder}/mrdoc/pdf/*.pdf (documentation).
  Administrative files (.rtf, .htm, .zip - e.g. file_information.rtf, UKDA_Study_*_Information.htm, ukda_data_dictionaries.zip, read*.htm) are excluded to maintain repository focus.
