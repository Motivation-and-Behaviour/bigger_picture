notes: |
  2 cohorts - 8th-10th Graders and 12th Graders. Waves every year from 2000-2024. Each wave has multiple datasets.
  Waves 2000-2011 datafiles are .dta. 2012-2024 are .rda. All codebooks PDF. 
  8th-10th Grades:
  Eight datasets in each wave from 2000-2008. Each has supplementary syntax in addition to the data and codebook.
  2012-2018 have 1 dataset each with user guide in addition to data and codebook. 
  2019 has 2 datasets, each without a codebook.
  2020-2024 have 1 dataset each. Have extra documentation (not read in) in addition to the data and codebook.
  12th Grade:
  Seven datasets in each wave except 2019 which has nine datasets.
  2001-2011 has data, codebook and supplementary syntax (not read in).
  2012-2016 has only codebook and data.
  2017-2022 no codebook, only data. 
  2023-2024 has codebook and data.
  