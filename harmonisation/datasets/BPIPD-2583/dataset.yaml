notes: |
  6 cycles of Health Canada's school survey series: the Youth Smoking Survey
  (YSS) 2002 and 2006-07, the Canadian Student Tobacco, Alcohol and Drugs
  Survey (CSTADS) 2014-15, 2016-17 and 2021-22, and the Canadian Student
  Alcohol and Drugs Survey (CSADS) 2023-24. Independent samples each cycle
  (repeated cross-section); no student is linked across cycles.
  Folder layout: YSS/<year>/ and CSADS/<year>/, one folder per cycle. The
  CSADS/ folder holds all four CSTADS/CSADS cycles, and its year folders are
  named inconsistently: 2015 and 2017 are the 2014-15 and 2016-17 cycles (year
  of release), 2021 and 2023 the 2021-22 and 2023-24 cycles (first year).
  Each cycle's data are read once, from the labelled .sav where one exists
  (YSS and 2014-15/2016-17) or from the CSV (2021-22/2023-24, the only
  format supplied). Not read: the CSV/, SAS/, SPSS/, STATA/ and STATA7/
  subfolders (the same data in other formats, several zipped), the zipped
  bootstrap weight files (cst14_bstrap, cst16_bstrap), the SAS/SPSS
  value-label command files (the .sav carries the labels), the .doc twins of
  the YSS 2002 PDFs, readstep.html, yss2002.sas, and the 2014-15/2016-17
  summary-of-results leaflets.
  YSS/2006/ also holds byte-identical copies of the 2002 files (the .sav,
  CSV, SAS, SPSS and Stata data and the 2002 documentation) that are not
  in the 2006 MANIFEST.TXT; only the 2006-07 supplemental file is read.
  The 2006-07 "supplemental" file is the full YSS 2006-07 student sample
  (71,003 students, modules A, B1 and B2) with every item; the "main" file
  it supplements is not supplied.
  The tidier keeps only the two YSS cycles: the CSTADS/CSADS cycles field no
  screen-use item, so they are dropped under the screen-wave rule.
