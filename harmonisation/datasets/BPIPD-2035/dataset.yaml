        role: "codebook"
        glob: "Korea*Violence Survey_20231231/코드북_23년사이버폭력실태조사(청소년).xlsx"

notes: |
  National Survey on Cyber Violence Among Adolescents. 
  Dataset is organised into year-specific directories (2020, 2021, and 2023). 
  All data files are provided as Excel workbooks. 
  The 2020 wave contains separate datasets for students, adults, 
  teachers, and parents. The 2021 wave contains separate datasets for students 
  and adults. The 2023 wave contains separate datasets for adolescents and 
  adults, along with corresponding Excel codebooks for each population group.
