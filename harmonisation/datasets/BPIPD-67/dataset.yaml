notes: |
  ICPSR 36498 PATH Study Public-Use Files, v25 (2026-07-09), waves 1 to 8, and ICPSR 37786
  Special Collection Public-Use Files (folder Supplementary Cohort), the half-waves 4.5, 5.5 and
  7.5: follow-up interviews of the same youth between main waves, not a separate cohort.
  Read: the eleven Youth / Parent Questionnaire files (36498 DS1002 to DS8002; 37786 DS1002,
  DS2002 and DS4002), and for waves 3 to 8 the one youth weight file per wave that PATH designates
  for cross-sectional estimates (User Guide Table 6.1): Wave 3 single-wave (DS3202), Wave 4
  Cohort cross-sectional (DS4322), Wave 4 Cohort single-wave at waves 5 and 6 (DS5222, DS6222),
  Wave 7 Cohort cross-sectional (DS7332) and Wave 7 Cohort single-wave at wave 8 (DS8232).
  Waves 1 and 2 carry their weights in the youth files. The half-wave weight files of 37786 are
  not in the study folder.
  Not read: the adult files and adult weights (adults are 18 or older), the youth all-waves,
  older-cohort single-wave and special-collection weights (longitudinal analyses only), and the
  ever/never tobacco reference files (DS3503 to DS6503; ICPSR releases DS5503 without an .rda).
  Each .rda file holds one object, da<study>.<DS number>.
