notes: |
  Growing Up in Australia: The Longitudinal Study of Australian Children (LSAC), General Release files of Release 10 (waves 1 to 10); the folder holds no user guide or data dictionary, so release, file contents and wave structure come from the LSAC Data User Guide Release 10.1 (AIFS, September 2026, doi:10.26193/XMLCQP) and the files themselves.
  Two cohorts: B (born March 2003 to February 2004) and K (born March 1999 to February 2000), recruited in 2004; files are named by cohort and the study child's age at the wave (lsacgrb0 = B cohort, age 0-1, wave 1).
  Every data table is keyed by hicid (one row per study child in each survey, mail-out, CogState and NAPLAN file); the cohort and wave columns inside each survey file agree with the wave block it is declared in (9C1 and 9C2 are coded 9.1 and 9.2).
  Format: every data file is read from the Stata (.dta) copy, which carries the value and variable labels; the identical SAS (.sas7bdat) and SPSS (.sav) copies and the SAS Formats folder are not declared.
  The STATA Formats .do files repeat the label definitions already inside the .dta files and are declared as docs only.
  Wave 1.5 (2005 mail-out) is merged into the wave 1 files by the study; waves 2.5 and 3.5 are separate mail-out files (lsacgrb3, lsacgrk7, lsacgrb5, lsacgrk9) whose respondents need not have answered the wave before them, and they carry parent-reported weekday and weekend TV, DVD, computer and electronic-game time.
  lsacgrk9 holds five rows (hicids 63107184, 71111060, 73311721, 74312185, 75312553) and lsacnaplan one row (hicid 11104216) in which every column but hicid is empty; the tidier should drop them.
  Time-use diaries are a second screen measure: diaryb0/b2/b4 and diaryk4/k6/k8 are the cleaned waves 1-3 paper diaries completed by the parent (one row per diary, up to two diaries per child, 96 fifteen-minute periods); tudk10, tudk12, tudk14, tudb10, tudb12 and tudb14 are the waves 4-8 study-child activity-episode diaries in long format (one row per episode).
  The TUDs/STATA/alternatives folder (ucdiary = uncleaned diaries, poortuds = diaries excluded after cleaning) is not declared: the user guide offers them only for sensitivity checks against the cleaned files declared here.
  CogState executive-function tasks of the study child (execksc, K cohort wave 6; execbsc, B cohort wave 8) are data for the cog_*_task rows; execkp1 is the K cohort Parent 1's own CogState at wave 7 and is declared as docs.
  NAPLAN (lsacnaplan) is linked test data with one row per study child of both cohorts (Years 3, 5, 7 and 9 scores, grade repetition) for the acc_*_stdtest and acc_graderepeated rows.
  MySchool (school-level ACARA data, Release 8.0 files, up to 2018) and the Event History Calendar (long event files for employment, residence, study and relationships from waves 7, 8 and 10) are declared as docs: no dataschema row needs them, and school sector is asked in the survey files.
  Not declared: the household composition rosters hhgrb and hhgrk (about 15,000 columns each; the derived household variables the schema needs, such as sibling counts, two-parent household and parent ages, are in the wave files), the parental, P1 RAP and PLE household files (phhgrk, p1raphhgrk16, plehhgrb6-14, plehhgrk10-16), and the study child's own children files (lsacgrsccb, lsacgrscck).
  GR Frequencies (one folder of PDFs per wave file) are declared as the codebooks; their frequencies are weighted by the wave's sample weight.
