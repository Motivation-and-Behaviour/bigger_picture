notes: |
  15 waves (rounds 10 through 24).

  Each wave has three CSV data files, one per unit of observation:
    d{wave}v31_KMP_csv.csv - device-level data
    h{wave}v31_KMP_csv.csv - household-level data
    p{wave}v31_KMP_csv.csv - person/individual-level data
  "v31" appears to denote the data version/release, common to all files.

  A single 2025 user guide PDF is included as a dataset-wide docs resource.
