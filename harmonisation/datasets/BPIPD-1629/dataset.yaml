dataset_id: "1629"
dataset_name: "EU Kids Online"
status: "in_progress"

resources:
  - name: "Primary Dataset"
    role: "data"
    glob: "stata9/eu_kids_online_2010.dta"
    reader: "stata"
  - name: "Data Dictionaries"
    role: "codebook"
    glob: ["mrdoc/allissue/eu_kids_online_2010_ukda_data_dictionary.rtf", "mrdoc/excel/eu_kids_online_2010_data_dictionary.xls"]
  - name: "Analytical and Supplemental Packs"
    role: "data"
    glob: ["mrdoc/excel/eu_kids_online_education_pack_by_country.xls", "mrdoc/excel/eu_kids_online_ses_pack.xls"]
    reader: "excel"
  - name: "Documentation and Reports"
    role: "docs"
    glob: 
      - "6885_file_information.rtf"
      - "mrdoc/pdf/*.pdf"
      - "mrdoc/stataissue/6885_spss_to_stata_conversion.rtf"
      - "mrdoc/UKDA/UKDA_Study_6885_Information.htm"
      - "read6885.htm"

notes: |
  Dataset includes primary survey data in Stata format (.dta) located in 'stata9/', 
  accompanied by data dictionaries and supplemental analytical packs found within 'mrdoc/'. 
  Documentation and reports are provided in PDF, RTF, and HTM formats across various 
  subdirectories in 'mrdoc/', covering technical user guides, comparative country 
  questionnaires, and cross-platform conversion instructions.
  
