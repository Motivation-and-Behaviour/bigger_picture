notes: |
  Dataset is organised into two subdirectories: 'between_level' and 
  'within_level'. The primary data files are supplied as CSV files containing 
  between-person and within-person analyses, app usage metrics, wellbeing 
  measures, and modelling results. Replication code is provided in both Python 
  (.py) and R (.R) formats. Additional outputs include JPG figures illustrating
  correlations between wellbeing and app activity metrics, and HTML files 
  containing model results and interactive visualisations. No separate codebook 
  files were identified in the folder structure.
