notes: |
  All dataset files are stored within the subdirectory '0004'. 
  The dataset contains five study components (haha, jikan9, jikan10, jikan13, 
  and kodomo). Each component is provided in CSV, Stata (.dta), and SPSS (.sav) 
  formats representing equivalent versions of the same data. 
  Associated label text files provide variable labels/codebook information for 
  each component. A dataset-level README text file provides additional 
  documentation."
