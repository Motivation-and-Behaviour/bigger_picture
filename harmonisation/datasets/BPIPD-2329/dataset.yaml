notes: |
  Dataset: Koch, BPIPD-2329.

  File contents:
    - "Data memory and media.Rdata" = the actual R data object - contains only one object.
    - "Analyses Toddler Media and Memory 2nd revision.R" = the R script that reads
      and processes the .Rdata file -> captured as a "docs" resource and flagged
      "read/setup syntax"
    - "Toddlers Memory and Media.Rproj" = RStudio project file -> captured as "docs".
    - "Description.docx" and "Supplement material Survey Item.docx" = reference/
      supporting material -> captured as "docs".
    - ".Rhistory" = R console session history file. This is typically an incidental
      autosave artifact rather than a deliberate deliverable; it has been included
      here as a "docs" resource for completeness
