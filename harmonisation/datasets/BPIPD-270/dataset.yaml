notes: >
  KCYPS 2018 tracks Elementary (e4) and Middle/High School (m1) student cohorts across 7 waves.
  Data is available in two parallel formats -- CSV and RDA -- both included as separate resources
  per wave/cohort/file. Main-panel (Y) and guardian (P) files run waves 1-7; sibling (S) files run
  waves 2-7 only. A shared root-level Excel file (KCYPS2018 Codebook_ENG.xlsx) contains three
  codebook sheets: elementary (CB_e), middle/high school (CB_m), and guardian (CB_p).
  Wave 7 questionnaires include an additional 'hYw7' file whose cohort is unconfirmed; included
  as a docs resource pending clarification.
  
