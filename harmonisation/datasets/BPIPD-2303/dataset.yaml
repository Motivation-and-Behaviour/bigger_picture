dataset_id: "2303"
dataset_name: "MiMic project"
status: "in_progress"

resources:
  - name: "Mplus Dat Dataset"
    role: "data"
    reader: "tsv" # PLACEHOLDER: confirmed via screenshot that this is space-delimited free-format text (no tabs, no commas). Column names/order need to come from the corresponding Mplus syntax file's VARIABLE: section, since .dat files have no header row. 
    glob: "mplus.dat"
  - name: "Mplus SAV Dataset"
    role: "data"
    reader: "spss"
    glob: "mplus.sav" 
  - name: "PDBWA SPSS Dataset"
    role: "data"
    reader: "spss"
    glob: "PDBWA SPSS.sav"
  - name: "Appendix A Measures Codebook"
    role: "codebook"
    glob: "Appendix A_Measures.pdf"
  - name: "Mplus Syntax Script"
    role: "docs"
    glob: "Syntax mplus ready.sps" # This is an SPSS/Mplus syntax script
notes: |
  Dataset contents include primary data files in SPSS (.sav) and Mplus data format (.dat).
  Documentation and setup materials include measure details (.pdf) and a syntax script (.sps).

  mplus.dat is space-delimited free-format text (confirmed from a sample), not tab-separated -
  the "tsv" reader currently set is a placeholder pending a proper fixed reader implementation.
  "-999" appears throughout and is likely a numeric missing-value code.
  
