notes: |
  The Future of Families and Child Wellbeing Study (FFCWS) Public Use Dataset.
  The root directory contains ICPSR catalog-level text, HTML files, and an R factor recoding script. 
  The 'DS0001' folder contains the primary .rda dataset and extensive PDF documentation 
  including survey wave user guides (Baseline through Year 22) and Year 22 multi-mode questionnaires.
