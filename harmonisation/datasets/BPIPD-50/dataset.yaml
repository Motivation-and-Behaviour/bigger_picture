dataset_id: "50"
dataset_name: "NSLY-Child"
status: "in_progress"

resources:
  - name: "Main Dataset (CSV Format)"
    role: "data"
    glob: "biggerpicture.csv"
    reader: "csv"
  - name: "Raw Data File"
    role: "data"
    glob: "biggerpicture.dat"
    reader: "csv" # PLACEHOLDER: biggerpicture.dat is a flat fixed-width file, "csv" will likely misparse columns. Substitute with the correct reader once determined
  - name: "NLSY Codebook File"
    role: "codebook"
    glob: "biggerpicture.cdb"
  - name: "Child/Young Adult Cohort Specification"
    role: "codebook"
    glob: "biggerpicture.CHILDYA"
  - name: "Data Loading Script"
    role: "docs"
    glob: "biggerpicture.R"
  - name: "Data Extraction Log"
    role: "docs"
    glob: "extract.log"

notes: |
  This dataset represents an extract from the NLSY Child/Young Adult cohort (BPIPD-50).
  It includes a flat raw data file (.dat), an export companion (.csv), and the standard
  NLSY metadata files (.cdb and .CHILDYA). The .R file is an R setup script for loading the data.

  Note: both biggerpicture.csv and biggerpicture.dat are currently marked role "data". If these
  represent the same underlying extract in two formats rather than genuinely distinct data, consider
  changing one to role "docs" to avoid the pipeline reading in duplicate/conflicting data.
  
