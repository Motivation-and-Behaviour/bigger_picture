# Runs the standalone testthat suite. The suite only reads files tracked in
# the repository (harmonisation metadata + inline fixtures); it never needs
# the mounted dataset directory, so CI requires no data access or secrets.
#
# Runs inside the devcontainer's base image, which already has R and the
# project's packages, so there is no R or package setup to repeat per run.
on:
  push:
    branches: [main, master]
  pull_request:

name: test-project.yaml

permissions: read-all

jobs:
  test-project:
    runs-on: ubuntu-latest
    container: ghcr.io/tarensanders/r-base:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packages missing from the image
        run: Rscript .github/scripts/install-missing-deps.R

      - name: Run tests
        run: testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
        shell: Rscript {0}
