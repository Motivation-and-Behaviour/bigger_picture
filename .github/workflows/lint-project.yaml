# Lints the repository with lintr (.lintr disables the linters Air enforces).
# Runs inside the devcontainer's base image, which already has R and lintr.
on:
  push:
    branches: [main, master]
  pull_request:

name: lint-project.yaml

permissions: read-all

jobs:
  lint-project:
    runs-on: ubuntu-latest
    container: ghcr.io/tarensanders/r-base:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install packages missing from the image
        run: Rscript .github/scripts/install-missing-deps.R

      - name: Lint root directory
        run: lintr::lint_dir()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
