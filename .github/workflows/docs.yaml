# Builds the Quarto documentation site in docs/ and deploys it to GitHub
# Pages. The build runs on every pull request so broken docs can't merge;
# deployment only happens on pushes to the default branch. Like the test
# suite, the site is generated entirely from repository files and needs no
# access to the dataset mount.
#
# One-time repository setup: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main, master]
  pull_request:

name: docs.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: read-all
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs Imports + Config/Needs/website from DESCRIPTION (with caching)
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website

      - name: Render site
        run: quarto render docs

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
