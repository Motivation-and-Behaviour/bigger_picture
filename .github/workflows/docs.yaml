# Builds the Quarto documentation site in docs/ and deploys it to GitHub
# Pages. The build runs on every pull request so broken docs can't merge;
# deployment only happens on pushes to the default branch. Like the test
# suite, the site is generated entirely from repository files and needs no
# access to the dataset mount. The build runs inside the devcontainer's base
# image, which already has R, Quarto and the project's packages.
#
# One-time repository setup: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main, master]
  pull_request:

name: docs.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/tarensanders/r-base:latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v7

      - name: Install packages missing from the image
        run: Rscript .github/scripts/install-missing-deps.R

      - name: Render site
        run: quarto render docs

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
